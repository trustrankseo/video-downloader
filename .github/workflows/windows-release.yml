name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements-windows.txt

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm "Video Downloader by Zubair Abbas.spec"

      - name: Read application version
        shell: pwsh
        run: |
          $match = Select-String -Path app.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $match) { throw "APP_VERSION not found" }
          "APP_VERSION=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/VideoDownloaderSetup-v*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderSetup-v${{ env.APP_VERSION }}
          path: release/VideoDownloaderSetup-v*.exe
