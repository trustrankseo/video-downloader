name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare fixed test signing key
        run: |
          mkdir -p signing
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
          keytool -list -v -keystore signing/universal-test.jks -storepass android -alias universaltest | grep -E "Owner:|SHA256:"
      - name: Harden TikTok scanner and profile rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/faisal/freshdownloader/PublicProfileBrowserScanner.kt')
          s = p.read_text()
          old = 'webView.loadUrl(targetUrl)\n            }\n        }\n        root.addView(continueButton'
          new = 'if (platform == "tiktok") {\n                    webView.settings.userAgentString = MOBILE_UA\n                }\n                webView.loadUrl(targetUrl)\n            }\n        }\n        root.addView(continueButton'
          if old in s: s = s.replace(old, new, 1)
          old = "else{(html.match(/\\/@[^\\\"'<>\\\\/]+\\/video\\/\\d+/gi)||[]).forEach(x=>links.push('https://www.tiktok.com'+x));links=links.filter(h=>/tiktok\\.com\\/@[^/]+\\/video\\/\\d+/i.test(h));}"
          new = """else{
                (html.match(/\\/@[^\\\"'<>\\\\/]+\\/video\\/\\d+/gi)||[]).forEach(x=>links.push('https://www.tiktok.com'+x));
                const m=(location.pathname||'').match(/^\\/@([^/]+)/i); const user=m&&m[1]?m[1]:'';
                if(user){
                  const pats=[/\"id\"\\s*:\\s*\"(\\d{10,})\"\\s*,\\s*\"desc\"/g,/\"awemeId\"\\s*:\\s*\"(\\d{10,})\"/g,/\"aweme_id\"\\s*:\\s*\"(\\d{10,})\"/g,/\"itemId\"\\s*:\\s*\"(\\d{10,})\"/g];
                  pats.forEach(r=>{let q; while((q=r.exec(html))!==null){links.push('https://www.tiktok.com/@'+user+'/video/'+q[1]);}});
                }
                links=links.filter(h=>/tiktok\\.com\\/@[^/]+\\/video\\/\\d+/i.test(h));
              }"""
          if old in s: s = s.replace(old, new, 1)
          old = '                found.clear()\n                webView.loadUrl(targetUrl)\n            }\n        }\n        root.addView(scanButton'
          new = '                found.clear()\n                if (platform == "tiktok") {\n                    webView.settings.userAgentString = MOBILE_UA\n                    val joiner = if (targetUrl.contains("?")) "&" else "?"\n                    webView.loadUrl(targetUrl + joiner + "is_from_webapp=1&sender_device=mobile")\n                } else {\n                    webView.loadUrl(targetUrl)\n                }\n            }\n        }\n        root.addView(scanButton'
          if old in s: s = s.replace(old, new, 1)
          old = '            } else if (found.isEmpty() && authenticated) {\n                statusView.text = "Signed in, but no video links were visible yet. Scroll once and tap SCAN PROFILE again."\n            } else if (platform == "tiktok") {'
          new = '            } else if (found.isEmpty() && authenticated) {\n                statusView.text = if (platform == "tiktok") "Signed in, but TikTok did not render video links yet. Tap SCAN PROFILE to reload the mobile profile and scan again." else "Signed in, but no video links were visible yet. Scroll once and tap SCAN PROFILE again."\n            } else if (platform == "tiktok") {'
          if old in s: s = s.replace(old, new, 1)
          old = 'override fun onDestroy(){PublicProfileBrowserScanner.detach(this);if(!finished)PublicProfileBrowserScanner.complete(requestId,found.toList());handler.removeCallbacksAndMessages(null);if(::webView.isInitialized)runCatching{webView.destroy()};super.onDestroy()}'
          new = 'override fun onDestroy(){\n              PublicProfileBrowserScanner.detach(this)\n              if(!finished && platform != "tiktok") PublicProfileBrowserScanner.complete(requestId,found.toList())\n              handler.removeCallbacksAndMessages(null)\n              if(::webView.isInitialized) runCatching{webView.destroy()}\n              super.onDestroy()\n          }'
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          e = Path('app/src/main/java/com/faisal/freshdownloader/DownloaderEngine.kt')
          t = e.read_text()
          old = '    private fun applySessionCookie(request: YoutubeDLRequest, rootUrl: String) {\n        val cookie = runCatching { CookieManager.getInstance().getCookie(rootUrl) }.getOrNull()\n        if (!cookie.isNullOrBlank()) {\n            request.addOption("--add-header", "Cookie: $cookie")\n        }\n    }\n'
          new = '    private fun applySessionCookie(request: YoutubeDLRequest, rootUrl: String) {\n        val rawCookie = runCatching { CookieManager.getInstance().getCookie(rootUrl) }.getOrNull()\n        if (rawCookie.isNullOrBlank()) return\n        val host = runCatching { URL(rootUrl).host.lowercase() }.getOrNull() ?: return\n        val domain = if (host.startsWith("www.")) "." + host.removePrefix("www.") else "." + host\n        val safeName = host.replace(Regex("[^a-z0-9.-]"), "_")\n        val cookieFile = File(context.filesDir, "session-$safeName.cookies.txt")\n        val lines = mutableListOf("# Netscape HTTP Cookie File")\n        rawCookie.split(\';\').forEach { part ->\n            val pair = part.trim()\n            val eq = pair.indexOf(\'=\')\n            if (eq <= 0) return@forEach\n            val name = pair.substring(0, eq).trim()\n            val value = pair.substring(eq + 1).trim()\n            if (name.isBlank()) return@forEach\n            lines += listOf(domain, "TRUE", "/", "TRUE", "0", name, value).joinToString("\\t")\n        }\n        if (lines.size <= 1) return\n        runCatching {\n            cookieFile.writeText(lines.joinToString("\\n", postfix = "\\n"))\n            request.addOption("--cookies", cookieFile.absolutePath)\n        }\n    }\n'
          if old not in t: raise SystemExit('applySessionCookie patch target not found')
          e.write_text(t.replace(old, new, 1))
          PY
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FreshDownloader-debug-apk
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
