name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPTODOWN_APP_URL: ${{ vars.UPTODOWN_APP_URL }}
      APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
      APPLOVIN_BANNER_AD_UNIT_ID: ${{ secrets.APPLOVIN_BANNER_AD_UNIT_ID }}
      APPLOVIN_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.APPLOVIN_INTERSTITIAL_AD_UNIT_ID }}
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Huawei release signing key
        env:
          HUAWEI_KEYSTORE_B64: ${{ secrets.HUAWEI_KEYSTORE_B64 }}
        run: |
          if [ -z "$HUAWEI_KEYSTORE_B64" ]; then
            echo "Missing HUAWEI_KEYSTORE_B64 repository secret"
            exit 1
          fi
          echo "$HUAWEI_KEYSTORE_B64" | base64 -d > signing/huawei-release.jks
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build signed Huawei release APK
        env:
          HUAWEI_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$HUAWEI_KEYSTORE_PASSWORD" ]; then
            echo "Missing HUAWEI_KEYSTORE_PASSWORD repository secret"
            exit 1
          fi
          gradle :app:assembleRelease --stacktrace
      - name: Verify production-signed release APK
        run: |
          test -f signing/huawei-release.jks
          test ! -f signing/universal-test.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk UniversalDownloader-v1.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-v1.5.0-Uptodown-AppLovin
          path: android-v2/UniversalDownloader-v1.5.0.apk
          if-no-files-found: error
      - name: Publish GitHub Release v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 android-v2/UniversalDownloader-v1.5.0.apk --clobber
          else
            gh release create v1.5.0 android-v2/UniversalDownloader-v1.5.0.apk \
              --target fresh-android-v2 \
              --title "Universal Downloader v1.5.0" \
              --notes "Uptodown release with AppLovin MAX banner and interstitial monetization, free Single/Bulk/Channel downloads, updated privacy consent, and stability fixes."
          fi
