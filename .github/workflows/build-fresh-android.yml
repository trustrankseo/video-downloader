name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Huawei release signing key
        env:
          HUAWEI_KEYSTORE_B64: ${{ secrets.HUAWEI_KEYSTORE_B64 }}
        run: |
          if [ -z "$HUAWEI_KEYSTORE_B64" ]; then
            echo "Missing HUAWEI_KEYSTORE_B64 repository secret"
            exit 1
          fi
          echo "$HUAWEI_KEYSTORE_B64" | base64 -d > signing/huawei-release.jks
      - name: Build signed Huawei release APK
        env:
          HUAWEI_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$HUAWEI_KEYSTORE_PASSWORD" ]; then
            echo "Missing HUAWEI_KEYSTORE_PASSWORD repository secret"
            exit 1
          fi
          gradle :app:assembleRelease --stacktrace
      - name: Verify production-signed release APK
        run: |
          test -f signing/huawei-release.jks
          test ! -f signing/universal-test.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-v1.4.9-Huawei-Review-Fix
          path: android-v2/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
