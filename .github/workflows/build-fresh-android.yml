name: Universal Downloader Auto Green Release

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2, audit-hardening-v1.6.0]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

permissions:
  contents: write

concurrency:
  group: universal-downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      UPTODOWN_APP_URL: ${{ vars.UPTODOWN_APP_URL }}
      APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
      APPLOVIN_BANNER_AD_UNIT_ID: ${{ secrets.APPLOVIN_BANNER_AD_UNIT_ID }}
      APPLOVIN_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.APPLOVIN_INTERSTITIAL_AD_UNIT_ID }}
    defaults:
      run:
        working-directory: android-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Read app version automatically
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          ARTIFACT_NAME="UniversalDownloader-v${VERSION}-Uptodown-AppLovin"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Prepare Uptodown update signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          test -f signing/universal-test.jks.b64
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
          keytool -list -v             -keystore signing/universal-test.jks             -storepass android             -alias universaltest | grep -E "Owner:|SHA256:"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build Uptodown update-compatible APK
        run: gradle :app:assembleUptodown --stacktrace --no-daemon

      - name: Verify signer matches installed-app chain
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          APK="app/build/outputs/apk/uptodown/app-uptodown.apk"
          EXPECTED_SHA256="146b8de20d69a75cecef7b949e2280a6779ae2590e4ed2af0c3f733a774af1ed"
          EXPECTED_MD5="471d573bfd94138a052087a80679b4f4"

          test -n "$APKSIGNER"
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_SHA256="$(printf '%s\n' "$CERTS" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ACTUAL_MD5="$(printf '%s\n' "$CERTS" | sed -n 's/^.*certificate MD5 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          echo "Expected signer SHA-256: $EXPECTED_SHA256"
          echo "Actual signer SHA-256:   $ACTUAL_SHA256"
          echo "Expected Uptodown MD5:   $EXPECTED_MD5"
          echo "Actual signer MD5:       $ACTUAL_MD5"
          test -n "$ACTUAL_SHA256"
          test -n "$ACTUAL_MD5"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_MD5" = "$EXPECTED_MD5"

      - name: Validate APK installability
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/uptodown/app-uptodown.apk"
          test -f "$APK"

          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 3 /tmp/apk-unzip-test.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -n "$AAPT"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          "$AAPT" dump badging "$APK" | head -n 25
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Enforce architecture and APK size budget
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/uptodown/app-uptodown.apk"
          APK_SIZE="$(stat -c%s "$APK")"
          MAX_SIZE="$((60 * 1024 * 1024))"

          echo "APK bytes: $APK_SIZE"
          echo "Size budget: $MAX_SIZE bytes (60 MiB)"
          test "$APK_SIZE" -le "$MAX_SIZE"

          unzip -l "$APK" >/tmp/apk-files.txt
          grep -q "lib/arm64-v8a/" /tmp/apk-files.txt
          if grep -Eq "lib/(armeabi-v7a|x86|x86_64)/" /tmp/apk-files.txt; then
            echo "Unexpected non-arm64 native libraries found."
            grep -E "lib/(armeabi-v7a|x86|x86_64)/" /tmp/apk-files.txt | head -n 30
            exit 1
          fi

          echo "Architecture gate passed: arm64-v8a only."
          echo "APK size gate passed."

      - name: Prepare release APK
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cp app/build/outputs/apk/uptodown/app-uptodown.apk "UniversalDownloader-v${VERSION}.apk"
          test -s "UniversalDownloader-v${VERSION}.apk"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: android-v2/UniversalDownloader-v${{ steps.meta.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write green verification summary
        shell: bash
        run: |
          {
            echo "## ✅ Universal Downloader GREEN"
            echo ""
            echo "- Version: v${{ steps.meta.outputs.version }}"
            echo "- Unit tests: passed"
            echo "- APK build: passed"
            echo "- Uptodown certificate MD5 + SHA-256: passed"
            echo "- APK installability checks: passed"
            echo "- arm64-only architecture gate: passed"
            echo "- APK size <= 60 MiB: passed"
            echo "- Artifact: ${{ steps.meta.outputs.artifact_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  device-smoke:
    name: Android Emulator Smoke Test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Prepare debug signing key and x86_64 test ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
          sed -i 's/abiFilters += setOf("arm64-v8a")/abiFilters += setOf("x86_64")/' app/build.gradle.kts
          grep -n "abiFilters" app/build.gradle.kts

      - name: Run real APK launch/privacy smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu

            # Build from the Android project explicitly. ReactiveCircus executes
            # this script from the repository root, so avoid relying on cd state.
            gradle -p android-v2 :app:assembleDebug --stacktrace --no-daemon
            adb install -r android-v2/app/build/outputs/apk/debug/app-debug.apk

            # Force a clean first launch so the privacy gate must be shown.
            adb shell pm clear com.faisal.freshdownloader
            adb logcat -c
            adb shell am start -W -n com.faisal.freshdownloader/.MainActivity

            # Give Compose a short moment to draw, then verify the app process
            # stayed alive and the expected first-launch UI is really present.
            sleep 5
            adb shell pidof com.faisal.freshdownloader

            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/universal-downloader-window.xml
            grep -F "Privacy Policy &amp; User Consent" /tmp/universal-downloader-window.xml
            grep -F "Agree &amp; Continue" /tmp/universal-downloader-window.xml

            # Surface startup crashes directly in CI if the smoke check fails.
            if adb logcat -d -t 400 | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\\.faisal\\.freshdownloader"; then
              echo "Startup crash detected in emulator logcat."
              exit 1
            fi

            echo "Real Android 15 APK launch/privacy smoke test passed."

  release:
    name: Publish Only After Green
    needs: [verify, device-smoke]
    if: ${{ github.ref == 'refs/heads/fresh-android-v2' && needs.verify.result == 'success' && needs.device-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7
        with:
          ref: fresh-android-v2

      - name: Download verified artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-apk

      - name: Verify downloaded release file
        shell: bash
        run: |
          set -euo pipefail
          APK="release-apk/UniversalDownloader-v${{ needs.verify.outputs.version }}.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish GitHub Release only after GREEN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          TAG="v${VERSION}"
          APK="release-apk/UniversalDownloader-v${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK"               --target fresh-android-v2               --title "Universal Downloader v${VERSION}"               --notes "Automatically verified GREEN release: unit tests, Uptodown APK build, signing-chain verification, APK structure/installability checks, and release artifact validation all passed."
          fi

      - name: Final release summary
        shell: bash
        run: |
          {
            echo "## 🚀 Release Published"
            echo ""
            echo "Universal Downloader v${{ needs.verify.outputs.version }} was published only after the complete GREEN verification gate passed."
          } >> "$GITHUB_STEP_SUMMARY"
