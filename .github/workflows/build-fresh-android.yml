name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare test signing key
        run: |
          mkdir -p signing
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
      - name: Apply native-only release patch
        run: python3 finalize_build.py
      - name: Apply sidebar UI import fix
        run: python3 ui_import_fix.py
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FreshDownloader-debug-apk
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
