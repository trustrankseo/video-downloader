name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: universal-downloader-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Universal Downloader Debug,O=Faisal Apps,C=PK"
          fi
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FreshDownloader-debug-apk
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
