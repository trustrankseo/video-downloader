name: Build Fresh Android APK
# Manual rebuild verification requested 2026-10-08

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPTODOWN_APP_URL: ${{ vars.UPTODOWN_APP_URL }}
      APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
      APPLOVIN_BANNER_AD_UNIT_ID: ${{ secrets.APPLOVIN_BANNER_AD_UNIT_ID }}
      APPLOVIN_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.APPLOVIN_INTERSTITIAL_AD_UNIT_ID }}
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Uptodown update signing key
        run: |
          mkdir -p signing
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
          keytool -list -v -keystore signing/universal-test.jks -storepass android -alias universaltest | grep -E "Owner:|SHA256:"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build Uptodown update-compatible APK
        run: gradle :app:assembleUptodown --stacktrace
      - name: Verify Uptodown signer matches installed-app chain
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          APK="app/build/outputs/apk/uptodown/app-uptodown.apk"
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED="146b8de20d69a75cecef7b949e2280a6779ae2590e4ed2af0c3f733a774af1ed"
          echo "Expected signer SHA-256: $EXPECTED"
          echo "Actual signer SHA-256:   $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Validate APK installability
        run: |
          APK="app/build/outputs/apk/uptodown/app-uptodown.apk"
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 3 /tmp/apk-unzip-test.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$AAPT"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -n 25
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Prepare release APK
        run: cp app/build/outputs/apk/uptodown/app-uptodown.apk UniversalDownloader-v1.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-v1.5.0-Uptodown-AppLovin
          path: android-v2/UniversalDownloader-v1.5.0.apk
          if-no-files-found: error
      - name: Publish GitHub Release v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 android-v2/UniversalDownloader-v1.5.0.apk --clobber
          else
            gh release create v1.5.0 android-v2/UniversalDownloader-v1.5.0.apk \
              --target fresh-android-v2 \
              --title "Universal Downloader v1.5.0" \
              --notes "Uptodown release with AppLovin MAX banner and interstitial monetization, free Single/Bulk/Channel downloads, updated privacy consent, and stability fixes."
          fi
