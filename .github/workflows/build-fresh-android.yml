name: Build Fresh Android APK

on:
  workflow_dispatch:
  push:
    branches: [fresh-android-v2]
    paths:
      - "android-v2/**"
      - ".github/workflows/build-fresh-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare fixed test signing key
        run: |
          mkdir -p signing
          base64 -d signing/universal-test.jks.b64 > signing/universal-test.jks
          keytool -list -v -keystore signing/universal-test.jks -storepass android -alias universaltest | grep -E "Owner:|SHA256:"
      - name: Harden TikTok CAPTCHA lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/faisal/freshdownloader/PublicProfileBrowserScanner.kt')
          s = p.read_text()
          old = 'override fun onDestroy(){PublicProfileBrowserScanner.detach(this);if(!finished)PublicProfileBrowserScanner.complete(requestId,found.toList());handler.removeCallbacksAndMessages(null);if(::webView.isInitialized)runCatching{webView.destroy()};super.onDestroy()}'
          new = '''override fun onDestroy(){
              PublicProfileBrowserScanner.detach(this)
              // TikTok CAPTCHA/verification can transiently recreate or destroy the WebView Activity.
              // Never release discovered links to the downloader from an implicit lifecycle destroy;
              // only explicit USE/CANCEL/BACK may complete the scan. This prevents fetching from
              // starting behind the CAPTCHA while the user is still solving it.
              if(!finished && platform != "tiktok") PublicProfileBrowserScanner.complete(requestId,found.toList())
              handler.removeCallbacksAndMessages(null)
              if(::webView.isInitialized) runCatching{webView.destroy()}
              super.onDestroy()
          }'''
          if old not in s:
              raise SystemExit('Expected onDestroy block not found; refusing unverified patch')
          p.write_text(s.replace(old, new))
          PY
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FreshDownloader-debug-apk
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
